
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Vagas | Candidate-se</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header class="cabecalho">
            <span class="marca">OPORTUNIDADES</span>
            <h1>Encontre seu próximo emprego</h1>
            <p>Preencha o formulário e candidate-se à vaga desejada.</p>
        </header>

        <form id="formulario">
            <h2>Dados pessoais</h2>

            <label for="nome">Nome completo *</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Seu nome completo" required>

            <label for="email">E-mail *</label>
            <input type="email" id="email" name="email"
                   placeholder="seuemail@email.com" required>

            <label for="telefone">Telefone *</label>
            <input type="tel" id="telefone" name="telefone"
                   placeholder="(61) 99999-9999" required>

            <h2>Informações profissionais</h2>

            <label for="vaga">Vaga desejada *</label>
            <select id="vaga" name="vaga" required>
                <option value="">Selecione uma vaga</option>
                <option>Jovem Aprendiz</option>
                <option>Auxiliar Administrativo</option>
                <option>Atendente</option>
                <option>Recepcionista</option>
                <option>Estágio</option>
            </select>

            <label for="escolaridade">Escolaridade *</label>
            <select id="escolaridade" name="escolaridade" required>
                <option value="">Selecione sua escolaridade</option>
                <option>Ensino Fundamental</option>
                <option>Ensino Médio cursando</option>
                <option>Ensino Médio completo</option>
                <option>Ensino Superior cursando</option>
                <option>Ensino Superior completo</option>
            </select>

            <label for="experiencia">Experiência profissional</label>
            <textarea id="experiencia" name="experiencia"
                      placeholder="Conte sobre suas experiências (se houver)"></textarea>

            <label for="mensagem">Link do currículo *</label>
            <textarea id="mensagem" name="mensagem"
                      placeholder="Fale sobre suas habilidades e qualidades"
                      required></textarea>

            <p class="observacao">* Campos obrigatórios</p>

            <button type="submit" id="botaoEnviar">
                Enviar candidatura
            </button>

            <p id="aviso" role="status" aria-live="polite"></p>
        </form>

        <footer>Portal de Vagas · Seu futuro começa aqui.</footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
